<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳麟 員工薪資查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==================================================== */
        /* Apple 官網級滿版頂級視覺規範                          */
        /* ==================================================== */
        :root {
            --apple-bg: #f5f5f7;
            --apple-wrapper-bg: #ffffff;
            --apple-card: rgba(255, 255, 255, 0.7);
            --apple-border: rgba(0, 0, 0, 0.06);
            --apple-text: #1d1d1f;
            --apple-text-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-danger: #ff3b30;
            --input-bg: #f5f5f7;
            --input-border: rgba(0, 0, 0, 0.1);
            --apple-ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --apple-bg: #000000;
            --apple-wrapper-bg: #161617;
            --apple-card: rgba(28, 28, 30, 0.7);
            --apple-border: rgba(255, 255, 255, 0.08);
            --apple-text: #f5f5f7;
            --apple-text-gray: #86868b;
            --apple-blue: #2997ff;
            --apple-blue-hover: #43a4ff;
            --apple-danger: #ff453a;
            --input-bg: #1c1c1e;
            --input-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--apple-text);
            transition: background-color 0.5s var(--apple-ease), color 0.5s var(--apple-ease);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .apple-nav {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--apple-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            box-sizing: border-box;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
            transition: background 0.5s var(--apple-ease);
        }
        [data-theme="dark"] .apple-nav { background: rgba(22, 22, 23, 0.8); }
        .nav-brand { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.9; }
        
        .theme-toggle-btn {
            background: transparent;
            border: none;
            color: var(--apple-text-gray);
            font-size: 12px;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s var(--apple-ease);
        }
        .theme-toggle-btn:hover { color: var(--apple-blue); }

        .main-wrapper {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 24px 60px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: appleFadeIn 0.6s var(--apple-ease) forwards;
        }

        /* Apple 風格轉圈圈 */
        .apple-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid var(--apple-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        [data-theme="dark"] .apple-spinner { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid var(--apple-blue); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @keyframes appleFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--apple-text); margin-top: 0; margin-bottom: 12px; font-size: 34px; font-weight: 700; letter-spacing: -0.04em; }
        
        .page { display: none; opacity: 0; width: 100%; }
        .page.active { display: block; animation: pageIn 0.5s var(--apple-ease) forwards; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-group { margin-bottom: 32px; text-align: left; }
        label { display: block; margin-bottom: 12px; color: var(--apple-text-gray); font-size: 14px; font-weight: 500; letter-spacing: -0.01em; text-align: center; }
        
        .select-wrapper { position: relative; max-width: 280px; margin: 0 auto; }
        select { width: 100%; padding: 14px 20px; border: 1px solid var(--input-border); border-radius: 12px; background-color: var(--input-bg); color: var(--apple-text); font-size: 16px; outline: none; appearance: none; text-align: center; text-align-last: center; font-weight: 500; }
        
        .password-wrapper { position: relative; width: 100%; margin-top: 8px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 16px 0; border: none; border-bottom: 1px solid var(--input-border); background: transparent; font-size: 24px; letter-spacing: 4px; color: var(--apple-text); outline: none; text-align: center; }
        
        .toggle-password-txt { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--apple-blue); font-size: 13px; }
        .remember-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; font-size: 14px; color: var(--apple-text-gray); cursor: pointer; }

        .employee-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-height: 340px; overflow-y: auto; padding: 6px; margin: 20px auto 0 auto; max-width: 400px; }
        .emp-btn { background-color: var(--apple-wrapper-bg); border: 1px solid var(--apple-border); border-radius: 14px; padding: 18px; font-size: 16px; cursor: pointer; color: var(--apple-text); transition: all 0.25s var(--apple-ease); }
        .emp-btn:hover { background-color: var(--input-bg); border-color: var(--apple-blue); }
        
        .btn-primary { width: 100%; max-width: 320px; padding: 16px; background-color: var(--apple-blue); border: none; color: white; border-radius: 28px; font-size: 16px; cursor: pointer; margin: 0 auto; display: block; }
        .btn-link { display: block; width: 100%; background: transparent; border: none; color: var(--apple-blue); font-size: 14px; cursor: pointer; margin-top: 24px; }
        
        .salary-slip { margin-top: 20px; background: var(--apple-wrapper-bg); border: 1px solid var(--apple-border); border-radius: 16px; padding: 10px 24px; }
        .slip-row { display: flex; justify-content: space-between; padding: 18px 0; border-bottom: 0.5px solid var(--apple-border); font-size: 16px; color: var(--apple-text); }
        .slip-total { display: flex; justify-content: space-between; padding: 26px 0 16px 0; font-weight: 700; font-size: 24px; color: var(--apple-text); border-top: 1px solid var(--apple-text); margin-top: 10px; }
        .deduct-style { color: var(--apple-danger); }
        .error-msg { color: var(--apple-danger); font-size: 14px; margin-top: 14px; text-align: center; display: none; }
        .welcome-msg { text-align: center; font-size: 14px; color: var(--apple-text-gray); margin-bottom: 36px; }
        
        /* 圖片預覽區塊樣式（原封不動呈呈現呈現呈現在正下方） */
        .img-preview-container { margin-top: 32px; display: none; text-align: center; animation: pageIn 0.4s var(--apple-ease) forwards; border-top: 1px dashed var(--apple-border); padding-top: 24px; }
        .preview-tip { font-size: 14px; color: var(--apple-blue); margin-bottom: 12px; font-weight: 500; }
        .generated-salary-img { width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); border: 1px solid var(--apple-border); }
    </style>
</head>
<body>

<div class="apple-nav">
    <div class="nav-brand">鳳麟 竹南店</div>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">深色模式</button>
</div>

<div class="main-wrapper" id="main-card">
    <div class="content-container">

        <div id="page-loading" class="page active">
            <h2>薪資查詢系統</h2>
            <div style="margin-top: 30px;">
                <div class="apple-spinner"></div>
                <div style="font-size: 15px; color: var(--apple-text-gray); margin-top: 20px;">連線中，請稍候</div>
            </div>
        </div>

        <div id="page-main" class="page">
            <h2>薪資查詢系統</h2>
            <div class="welcome-msg" id="greeting-txt"></div>
            <div class="input-group">
                <label>選擇查詢月份</label>
                <div class="select-wrapper"><select id="month-select"></select></div>
            </div>
            <label style="margin-bottom: 6px;">選擇您的姓名</label>
            <div class="employee-grid" id="employee-box"></div>
        </div>

        <div id="page-auth" class="page">
            <h2 id="auth-title">身分驗證</h2>
            <div class="input-group">
                <label>請輸入身分證後 4 碼</label>
                <div class="password-wrapper">
                    <input type="password" id="password" inputmode="numeric" maxlength="4" placeholder="0000" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeydown="if(event.key==='Enter') verifyPassword()">
                    <span class="toggle-password-txt" id="eye-icon" onclick="togglePasswordVisibility()">顯示</span>
                </div>
                <label class="remember-wrapper"><input type="checkbox" id="remember-pwd"> 記住密碼</label>
                <div class="error-msg" id="error-txt">密碼不正確。</div>
            </div>
            <button class="btn-primary" onmousedown="verifyPassword()" ontouchstart="verifyPassword(); event.preventDefault();">驗證</button>
            <button class="btn-link" onclick="goBack('page-main')">返回主畫面</button>
        </div>

        <div id="page-slip" class="page">
            <div id="capture-area" style="padding: 16px; border-radius: 16px; background: var(--apple-bg); transition: background 0.5s var(--apple-ease);">
                <h2 id="slip-title" style="font-size: 26px;">薪資明細表</h2>
                <div class="salary-slip">
                    <div class="slip-row"><span>員工姓名</span><span id="slip-name"></span></div>
                    <div class="slip-row"><span>時薪</span><span id="slip-wage"></span></div>
                    <div class="slip-row"><span>本月時數</span><span id="slip-hours"></span></div>
                    <div class="slip-row"><span>遲到 (分)</span><span id="slip-latemin"></span></div>
                    <div class="slip-row"><span>預支</span><span id="slip-advance" class="deduct-style"></span></div>
                    <div class="slip-row"><span>營損</span><span id="slip-loss" class="deduct-style"></span></div>
                    <div class="slip-row"><span>缺失次數</span><span id="slip-missing"></span></div>
                    <div class="slip-row"><span>遲到次數</span><span id="slip-latecount"></span></div>
                    <div class="slip-total"><span>實領薪資</span><span id="slip-total"></span></div>
                </div>
            </div>
            
            <div class="img-preview-container" id="preview-box">
                <div class="preview-tip">✨ 圖片已在下方產生！請長按圖片儲存</div>
                <img id="generated-img" class="generated-salary-img" src="" alt="薪資單圖片">
            </div>

            <button class="btn-primary" style="margin-top: 28px;" id="action-btn" onclick="downloadSlip()">產生薪資單圖片</button>
            <button class="btn-link" onclick="logout()">安全登出</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwnlxGByCNwcbJaLOP4kJB6UDHTZHRf3on24LAA60zKFtEQKCnfvOYHN6KdowKyTdnJ/exec"; 
    window.onload = function() { initTheme(); updateGreeting(); initSystem(); };

    function updateGreeting() {
        const hour = new Date().getHours();
        let greeting = (hour >= 5 && hour < 12) ? "早安。" : (hour >= 12 && hour < 18) ? "午安。" : "晚安。";
        document.getElementById('greeting-txt').innerText = greeting;
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('userTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-btn').innerText = savedTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function toggleTheme() {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('userTheme', newTheme);
        document.getElementById('theme-btn').innerText = newTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function initSystem() {
        fetch(`${API_URL}?action=getInitData`)
        .then(r => r.json())
        .then(data => {
            const monthSelect = document.getElementById('month-select');
            const currentMonthStr = (new Date().getMonth() + 1) + "月"; 
            data.months.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m; opt.innerText = m;
                if (m === currentMonthStr) opt.selected = true;
                monthSelect.appendChild(opt);
            });
            const employeeBox = document.getElementById('employee-box');
            data.names.forEach(name => {
                let btn = document.createElement('button');
                btn.className = 'emp-btn';
                btn.innerText = name;
                btn.onclick = () => selectEmployee(name);
                employeeBox.appendChild(btn);
            });
            switchPage('page-main');
        });
    }

    function selectEmployee(name) {
        window.currentSelectedEmployee = name;
        document.getElementById('auth-title').innerText = name;
        document.getElementById('password').value = localStorage.getItem('savedPwd_' + name) || "";
        // 切換頁面時順便把錯誤訊息藏起來
        document.getElementById('error-txt').style.display = "none";
        switchPage('page-auth');
    }

    function togglePasswordVisibility() {
        const pwd = document.getElementById('password');
        const eye = document.getElementById('eye-icon');
        pwd.type = pwd.type === "password" ? "text" : "password";
        eye.innerText = pwd.type === "password" ? "顯示" : "隱藏";
    }

    function verifyPassword() {
        const inputPwd = document.getElementById('password').value;
        if (!inputPwd) return; // 沒輸入密碼不反應
        
        const selectedMonth = document.getElementById('month-select').value;
        
        // 隱藏之前的錯誤訊息
        document.getElementById('error-txt').style.display = "none";

        fetch(`${API_URL}?action=getSalary&month=${encodeURIComponent(selectedMonth)}&name=${encodeURIComponent(window.currentSelectedEmployee)}&password=${encodeURIComponent(inputPwd)}`)
        .then(r => r.json())
        .then(data => {
            if (data.status === "success") {
                if (document.getElementById('remember-pwd').checked) localStorage.setItem('savedPwd_' + window.currentSelectedEmployee, inputPwd);
                const d = data.data;
                document.getElementById('slip-title').innerText = `${selectedMonth} 薪資明細`;
                document.getElementById('slip-name').innerText = window.currentSelectedEmployee;
                document.getElementById('slip-wage').innerText = Number(d.hourlyWage).toLocaleString() + " 元";
                document.getElementById('slip-hours').innerText = d.hours + " 小時";
                document.getElementById('slip-latemin').innerText = d.lateMin + " 分鐘";
                document.getElementById('slip-advance').innerText = "- " + Number(d.advance).toLocaleString() + " 元";
                document.getElementById('slip-loss').innerText = "- " + Number(d.loss).toLocaleString() + " 元";
                document.getElementById('slip-missing').innerText = d.missing + " 次";
                document.getElementById('slip-latecount').innerText = d.lateCount + " 次";
                document.getElementById('slip-total').innerText = `$ ${Number(d.totalSalary).toLocaleString()}`;
                
                document.getElementById('preview-box').style.display = 'none';
                document.getElementById('action-btn').style.display = 'block'; 
                
                switchPage('page-slip');
            } else {
                document.getElementById('error-txt').style.display = "block";
            }
        });
    }

    function downloadSlip() {
        const captureArea = document.getElementById('capture-area');
        const previewBox = document.getElementById('preview-box');
        const generatedImg = document.getElementById('generated-img');
        const actionBtn = document.getElementById('action-btn');

        html2canvas(captureArea, { 
            scale: 2,
            useCORS: true,
            backgroundColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#000000' : '#f5f5f7'
        }).then(canvas => {
            generatedImg.src = canvas.toDataURL('image/png');
            previewBox.style.display = 'block';
            actionBtn.style.display = 'none';
            previewBox.scrollIntoView({ behavior: 'smooth' });
        });
    }

    function switchPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function goBack(id) { switchPage(id); }
    function logout() { switchPage('page-main'); }
</script>
</body>
</html>
