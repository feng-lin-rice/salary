<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳麟 員工薪資查詢系統</title>
    <link rel="icon" href="feng-lin-logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="styles.css">
<style>
.brand-logo{width:34px;height:34px;object-fit:contain;display:block;flex:0 0 auto}.hero-logo{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.15))}.slip-brand .brand-logo{width:52px;height:52px}@media(max-width:420px){.hero-logo{width:78px;height:78px;margin-bottom:6px}}
</style>
</head>
<body>

<div class="apple-nav">
    <div class="nav-brand"><img class="brand-logo" src="feng-lin-logo.png" alt="鳳麟 Logo"><span><strong>鳳麟</strong><small>竹南店</small></span></div>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">深色模式</button>
</div>

<div class="main-wrapper" id="main-card">
    <div class="content-container">

        <div id="page-loading" class="page active">
            <h2 id="loading-title">薪資查詢系統</h2>
            <div id="loading-active" class="loading-state">
                <div class="apple-spinner"></div>
                <div>連線中，請稍候</div>
            </div>
            <div id="loading-error" class="connection-error" hidden>
                <p>請確認網路狀態後再試一次</p>
                <button class="btn-primary" id="retry-btn" onclick="retryConnection()">重新連線</button>
            </div>
        </div>

        <div id="page-main" class="page">
            <img class="hero-logo" src="feng-lin-logo.png" alt="鳳麟 Logo">
            <h2>薪資查詢系統</h2>
            <div class="welcome-msg" id="greeting-txt"></div>
            <div class="usage-guide"><span><b>1</b>選月份</span><i></i><span><b>2</b>選姓名</span><i></i><span><b>3</b>身分驗證</span></div>
            <div class="input-group">
                <label>選擇查詢月份</label>
                <div class="select-wrapper month-card"><span class="calendar-icon">日</span><select id="month-select"></select></div>
            </div>
            <label style="margin-bottom: 6px;">選擇您的姓名</label>
            <div class="employee-grid" id="employee-box"></div>
        </div>

        <div id="page-auth" class="page">
            <h2 id="auth-title">身分驗證</h2>
            <div class="input-group">
                <label>請輸入身分證後 4 碼</label>
                <div class="password-wrapper">
                    <input type="password" id="password" inputmode="numeric" maxlength="4" placeholder="0000" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeydown="if(event.key==='Enter') verifyPassword()">
                    <span class="toggle-password-txt" id="eye-icon" onclick="togglePasswordVisibility()">顯示</span>
                </div>
                <label class="remember-wrapper"><input type="checkbox" id="remember-pwd" checked> 記住密碼</label>
                <div class="error-msg" id="error-txt">密碼不正確。</div>
            </div>
            <button class="btn-primary" id="verify-btn" onclick="verifyPassword()">驗證</button>
            <button class="btn-link" id="back-btn" onclick="goBack('page-main')">返回主畫面</button>
        </div>

        <div id="page-slip" class="page">
            <div id="capture-area" class="salary-card">
                <div class="slip-brand"><img class="brand-logo" src="feng-lin-logo.png" alt="鳳麟 Logo"><div><strong>鳳麟竹南店</strong><small>員工薪資明細</small></div></div>
                <h2 id="slip-title" style="font-size: 24px; text-align: center; margin-bottom: 20px;">薪資明細表</h2>
                <div class="salary-slip">
                    <div class="slip-row"><span>員工姓名</span><span id="slip-name" style="font-weight: 500;"></span></div>
                    <div class="slip-row"><span>時薪</span><span id="slip-wage"></span></div>
                    <div class="slip-row"><span>本月時數</span><span id="slip-hours"></span></div>
                    <div class="slip-row"><span>遲到分鐘</span><span id="slip-latemin"></span></div>
                    <div class="slip-row"><span>預支</span><span id="slip-advance" class="deduct-style"></span></div>
                    <div class="slip-row"><span>營損</span><span id="slip-loss" class="deduct-style"></span></div>
                    <div class="slip-row"><span>缺失次數</span><span id="slip-missing"></span></div>
                    <div class="slip-row"><span>遲到次數</span><span id="slip-latecount"></span></div>
                    <div class="slip-total-container">
                        <div class="slip-total"><span>實領薪資</span><span id="slip-total"></span></div>
                        <span class="bonus-tip">（不含獎金）</span>
                    <div class="salary-calculation" id="salary-calculation"></div>
                    </div>
                </div>
            </div>
            
            <div class="img-preview-container" id="preview-box">
                <div class="preview-tip">✨ 圖片已在下方產生！請長按圖片儲存</div>
                <img id="generated-img" class="generated-salary-img" src="" alt="薪資單圖片">
            </div>

            <button class="btn-primary" style="margin-top: 24px;" id="action-btn" onclick="downloadSlip()">儲存／分享薪資單</button>
            <div class="error-msg" id="share-error"></div>
            <button class="btn-link" onclick="logout()">安全登出</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
