<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳麟 員工薪資查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==================================================== */
        /* Apple 官網極簡風格規範                               */
        /* ==================================================== */
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: rgba(255, 255, 255, 0.85);
            --apple-border: rgba(0, 0, 0, 0.08);
            --apple-text: #1d1d1f;
            --apple-text-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-danger: #ff3b30;
            --input-bg: rgba(0, 0, 0, 0.02);
            --input-border: rgba(0, 0, 0, 0.15);
        }

        /* 🌙 Apple 深色模式 (Midnight Black) */
        [data-theme="dark"] {
            --apple-bg: #000000;
            --apple-card: rgba(28, 28, 30, 0.85);
            --apple-border: rgba(255, 255, 255, 0.1);
            --apple-text: #f5f5f7;
            --apple-text-gray: #86868b;
            --apple-blue: #2997ff;
            --apple-blue-hover: #43a4ff;
            --apple-danger: #ff453a;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            background-image: none; /* 移除複雜背景圖，改為 Apple 標誌性純色底 */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--apple-text);
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple 核心卡片 - 清爽夾層結構 */
        .container { 
            position: relative;
            background: var(--apple-card); 
            backdrop-filter: blur(30px) saturate(180%); 
            -webkit-backdrop-filter: blur(30px) saturate(180%); 
            border-radius: 18px; 
            border: 0.5px solid var(--apple-border); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04);
            padding: 40px 32px; 
            width: 100%; 
            max-width: 420px;
            box-sizing: border-box; 
            transition: all 0.4s ease;
        }

        /* 右上角極簡黑白模式切換鈕 */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--apple-text-gray);
            font-size: 13px;
            letter-spacing: -0.01em;
            cursor: pointer;
            font-weight: 400;
        }
        .theme-toggle-btn:hover { color: var(--apple-blue); }

        /* Apple 經典粗體字標題 */
        h2 { 
            text-align: center; 
            color: var(--apple-text); 
            margin-top: 0;
            margin-bottom: 24px; 
            font-size: 26px;
            font-weight: 700; 
            letter-spacing: -0.03em;
        }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .input-group { margin-bottom: 28px; text-align: left; }
        label { display: block; margin-bottom: 10px; color: var(--apple-text-gray); font-size: 13px; font-weight: 500; }
        
        /* Apple 風格極簡下拉選單 */
        select { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid var(--input-border); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            background-color: var(--input-bg); 
            color: var(--apple-text);
            font-weight: 400;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.3s ease;
        }
        select:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.15); }
        
        /* 密碼輸入欄改為極簡優雅風格 */
        .password-wrapper { position: relative; width: 100%; }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-bottom: 1px solid var(--input-border);
            background: transparent;
            box-sizing: border-box;
            font-size: 18px;
            color: var(--apple-text);
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-bottom-color: var(--apple-blue); }
        
        /* 小眼睛改為純文字超連結樣式 */
        .toggle-password-txt { 
            position: absolute; 
            right: 0; 
            top: 50%; 
            transform: translateY(-50%); 
            cursor: pointer; 
            color: var(--apple-blue); 
            font-size: 13px; 
            font-weight: 400;
        }
        
        .remember-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--apple-text-gray); cursor: pointer; user-select: none; }
        .remember-wrapper input { width: 15px; height: 15px; border-radius: 4px; accent-color: var(--apple-blue); }

        /* 姓名列表改為乾淨的膠囊按鈕 */
        .employee-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-height: 260px; overflow-y: auto; padding: 4px; margin-top: 10px; }
        .emp-btn { background-color: var(--input-bg); border: 1px solid transparent; border-radius: 10px; padding: 14px; font-size: 15px; cursor: pointer; text-align: center; transition: all 0.2s ease; font-weight: 500; color: var(--apple-text); }
        .emp-btn:hover { background-color: rgba(128,128,128,0.1); }
        
        /* Apple 標誌性寶藍色膠囊按鈕 */
        .btn-primary { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--apple-blue); 
            border: none; 
            color: white; 
            border-radius: 22px; /* 經典膠囊弧度 */
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 500; 
            letter-spacing: -0.01em;
            transition: background-color 0.2s ease; 
        }
        .btn-primary:hover { background-color: var(--apple-blue-hover); }
        
        /* Apple 官網經典文字超連結按鈕 (Link Style) */
        .btn-link {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--apple-blue);
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 18px;
            transition: opacity 0.2s;
        }
        .btn-link:hover { text-decoration: underline; opacity: 0.8; }
        
        /* 明細表外觀 - 移除彩色小圖示，純文字靠左靠右 */
        .salary-slip { margin-top: 10px; }
        .slip-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 0.5px solid var(--apple-border); font-size: 15px; color: var(--apple-text); align-items: center; }
        .slip-label { color: var(--apple-text-gray); font-weight: 400; }
        .slip-value { font-weight: 500; }
        
        /* 實領薪資 - 大膽粗體字突顯 */
        .slip-total { display: flex; justify-content: space-between; padding: 20px 0; font-weight: 700; font-size: 20px; color: var(--apple-text); border-top: 1px solid var(--apple-text); margin-top: 16px; align-items: center; }
        .deduct-style { color: var(--apple-danger); }
        
        .error-msg { color: var(--apple-danger); font-size: 13px; margin-top: 10px; text-align: center; display: none; font-weight: 500; }
        .welcome-msg { text-align: center; font-size: 13px; color: var(--apple-text-gray); margin-top: -14px; margin-bottom: 24px; line-height: 1.4; }

        /* LINE 彈窗改為蘋果通知中心風格 */
        .line-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .line-modal-content {
            background: var(--apple-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid var(--apple-border);
            padding: 24px;
            border-radius: 14px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        #img-preview-area {
            margin-top: 20px;
            display: none;
            text-align: center;
            border-top: 0.5px solid var(--apple-border);
            padding-top: 16px;
        }
        #img-preview-area img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite steps(4);
            display: inline-block;
            width: 12px;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>

<div class="container" id="main-card">
    
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">深色模式</button>

    <div id="page-loading" class="page active">
        <h2>鳳麟 薪資查詢</h2>
        <div style="text-align:center; padding:20px; font-size: 14px; color: var(--apple-text-gray);">
            <span class="loading-dots">安全連線中</span>
        </div>
    </div>

    <div id="page-main" class="page">
        <h2>薪資查詢系統</h2>
        <div class="welcome-msg" id="greeting-txt"></div>
        <div class="input-group">
            <label for="month-select">選擇查詢月份</label>
            <select id="month-select"></select>
        </div>
        <label>選擇您的姓名</label>
        <div class="employee-grid" id="employee-box"></div>
    </div>

    <div id="page-auth" class="page">
        <h2 id="auth-title">身分驗證</h2>
        <div class="input-group" style="margin-top: 10px;">
            <label for="password">請輸入身分證後 4 碼</label>
            <div class="password-wrapper">
                <input type="password" id="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <span class="toggle-password-txt" id="eye-icon" onclick="togglePasswordVisibility()">顯示</span>
            </div>
            <label class="remember-wrapper">
                <input type="checkbox" id="remember-pwd"> 記住密碼
            </label>
            <div class="error-msg" id="error-txt">密碼不正確。</div>
        </div>
        <button class="btn-primary" id="submit-pwd-btn" onclick="verifyPassword()">驗證</button>
        <button class="btn-link" onclick="goBack('page-main')">返回主畫面</button>
    </div>

    <div id="page-slip" class="page">
        <div id="capture-area" style="padding: 10px; border-radius: 12px;">
            <h2 id="slip-title" style="margin-top: 10px; text-align: left; font-size: 24px;">薪資明細表</h2>
            <div class="salary-slip">
                <div class="slip-row">
                    <span class="slip-label">員工姓名</span>
                    <span id="slip-name" class="slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">時薪</span>
                    <span id="slip-wage" class="slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">本月時數</span>
                    <span id="slip-hours" class="slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">遲到 (分鐘)</span>
                    <span id="slip-latemin" class="slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">預支項目</span>
                    <span id="slip-advance" class="deduct-style slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">營運損失</span>
                    <span id="slip-loss" class="deduct-style slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">缺失次數</span>
                    <span id="slip-missing" class="slip-value"></span>
                </div>
                <div class="slip-row">
                    <span class="slip-label">遲到次數</span>
                    <span id="slip-latecount" class="slip-value"></span>
                </div>
                <div class="slip-total">
                    <span style="color: var(--apple-text);">實領薪資 <span style="font-size:12px; color:var(--apple-text-gray); font-weight:400;">(不含獎金)</span></span>
                    <span id="slip-total"></span>
                </div>
            </div>
        </div>
        
        <button class="btn-primary" style="margin-top: 20px;" id="download-btn" onclick="downloadSlip()">儲存薪資單圖片</button>
        
        <div id="img-preview-area">
            <p style="font-size: 12px; color: var(--apple-text-gray); margin: 0 0 12px 0;">已為您產生明細照片。請長按下方圖片儲存至相簿。</p>
            <img id="generated-img" src="" alt="薪資單圖片">
        </div>

        <button class="btn-link" style="margin-top: 20px;" onclick="logout()">安全登出</button>
    </div>

</div>

<div class="line-modal" id="line-alert">
    <div class="line-modal-content">
        <h3 style="margin-top: 0; font-size: 18px; font-weight: 600;">LINE 瀏覽器限制</h3>
        <p style="font-size: 13px; text-align: left; line-height: 1.5; color: var(--apple-text-gray); margin-bottom: 20px;">
            目前正使用 LINE 內建瀏覽器，該環境不支援直接下載檔案。<br><br>
            請長按畫面下方新生成的<strong>【薪資單圖片】</strong>直接儲存；或點擊右上角 <code>•••</code> 選擇<strong>【使用預設瀏覽器開啟】</strong>即可正常下載。
        </p>
        <button class="btn-primary" style="padding: 10px;" onclick="closeLineModal()">好</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwnlxGByCNwcbJaLOP4kJB6UDHTZHRf3on24LAA60zKFtEQKCnfvOYHN6KdowKyTdnJ/exec"; 

    let currentSelectedEmployee = "";
    let allMonths = [];
    let allEmployees = [];

    window.onload = function() { 
        initTheme();     
        updateGreeting(); 
        initSystem(); 
    };

    function updateGreeting() {
        const hour = new Date().getHours();
        let greeting = "";
        if (hour >= 5 && hour < 11) {
            greeting = "早安。今天也是充滿活力的一天。";
        } else if (hour >= 11 && hour < 14) {
            greeting = "午安。忙碌的午餐餐期辛苦了。";
        } else if (hour >= 14 && hour < 17) {
            greeting = "空班休息時間。充飽電再出發。";
        } else if (hour >= 17 && hour < 21) {
            greeting = "晚餐尖峰時間。辛苦了。";
        } else {
            greeting = "深夜下班辛苦了。回家路上請注意安全。";
        }
        document.getElementById('greeting-txt').innerText = greeting;
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('userTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const btn = document.getElementById('theme-btn');
        btn.innerText = savedTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        let newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('userTheme', newTheme);
        document.getElementById('theme-btn').innerText = newTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function isLineBrowser() {
        const ua = navigator.userAgent.toLowerCase();
        return ua.indexOf('line') !== -1;
    }

    function closeLineModal() {
        document.getElementById('line-alert').style.display = 'none';
    }

    function downloadSlip() {
        const target = document.getElementById('capture-area');
        const originalBg = target.style.background;
        
        const currentTheme = document.documentElement.getAttribute('data-theme');
        target.style.background = currentTheme === 'dark' ? '#1c1c1e' : '#ffffff';

        html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
            target.style.background = originalBg; 
            const imgDataURL = canvas.toDataURL('image/png');

            const previewArea = document.getElementById('img-preview-area');
            const previewImg = document.getElementById('generated-img');
            previewImg.src = imgDataURL;
            previewArea.style.display = 'block';

            if (isLineBrowser()) {
                document.getElementById('line-alert').style.display = 'flex';
                previewArea.scrollIntoView({ behavior: 'smooth' });
            } else {
                const link = document.createElement('a');
                link.download = `${document.getElementById('month-select').value}_鳳麟_${currentSelectedEmployee}_薪資明細.png`;
                link.href = imgDataURL;
                link.click();
            }
        });
    }

    function initSystem() {
        switchPage('page-loading');
        fetch(`${API_URL}?action=getInitData`)
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                allMonths = data.months;
                allEmployees = data.names;
                
                const monthSelect = document.getElementById('month-select');
                monthSelect.innerHTML = "";
                
                const currentMonthStr = (new Date().getMonth() + 1) + "月"; 

                allMonths.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m; 
                    opt.innerText = m;
                    if (m === currentMonthStr) {
                        opt.selected = true;
                    }
                    monthSelect.appendChild(opt);
                });

                const employeeBox = document.getElementById('employee-box');
                employeeBox.innerHTML = "";
                allEmployees.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'emp-btn';
                    btn.innerText = name;
                    btn.onclick = () => selectEmployee(name);
                    employeeBox.appendChild(btn);
                });
                
                switchPage('page-main');
            } else {
                alert("載入失敗：" + data.message);
            }
        })
        .catch(err => {
            alert("系統安全連線中，請稍候...");
            window.location.href = API_URL + "?action=getInitData";
        });
    }

    function selectEmployee(name) {
        currentSelectedEmployee = name;
        const selectedMonth = document.getElementById('month-select').value;
        document.getElementById('auth-title').innerText = name;
        
        const pwdInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('remember-pwd');
        document.getElementById('error-txt').style.display = "none";
        
        pwdInput.type = "password";
        document.getElementById('eye-icon').innerText = "顯示";
        
        const savedPassword = localStorage.getItem('savedPwd_' + name);
        if (savedPassword) {
            pwdInput.value = savedPassword; 
            rememberCheckbox.checked = true; 
        } else {
            pwdInput.value = "";
            rememberCheckbox.checked = false;
        }
        
        switchPage('page-auth');
    }

    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        if (pwdInput.type === "password") {
            pwdInput.type = "text";
            eyeIcon.innerText = "隱藏";
        } else {
            pwdInput.type = "password";
            eyeIcon.innerText = "顯示";
        }
    }

    function formatNumber(val) {
        if (isNaN(val) || val === "") return val;
        return Number(val).toLocaleString();
    }

    function verifyPassword() {
        const inputPwd = document.getElementById('password').value;
        if(!inputPwd) return;

        const selectedMonth = document.getElementById('month-select').value;
        const btn = document.getElementById('submit-pwd-btn');
        const rememberCheckbox = document.getElementById('remember-pwd');
        
        btn.innerText = "驗證中...";
        btn.disabled = true;

        fetch(`${API_URL}?action=getSalary&month=${encodeURIComponent(selectedMonth)}&name=${encodeURIComponent(currentSelectedEmployee)}&password=${encodeURIComponent(inputPwd)}`)
        .then(response => response.json())
        .then(data => {
            btn.innerText = "驗證";
            btn.disabled = false;

            if (data.status === "success") {
                if (rememberCheckbox.checked) {
                    localStorage.setItem('savedPwd_' + currentSelectedEmployee, inputPwd);
                } else {
                    localStorage.removeItem('savedPwd_' + currentSelectedEmployee);
                }

                const empData = data.data;
                document.getElementById('slip-title').innerText = `${selectedMonth} 薪資明細`;
                document.getElementById('slip-name').innerText = currentSelectedEmployee;
                
                document.getElementById('slip-wage').innerText = formatNumber(empData.hourlyWage) + " 元";
                document.getElementById('slip-hours').innerText = empData.hours + " 小時";
                document.getElementById('slip-latemin').innerText = empData.lateMin + " 分鐘";
                document.getElementById('slip-advance').innerText = "- " + formatNumber(empData.advance) + " 元";
                document.getElementById('slip-loss').innerText = "- " + formatNumber(empData.loss) + " 元";
                document.getElementById('slip-missing').innerText = empData.missing + " 次";
                document.getElementById('slip-latecount').innerText = empData.lateCount + " 次";
                document.getElementById('slip-total').innerText = `$ ${formatNumber(empData.totalSalary)}`;
                
                document.getElementById('img-preview-area').style.display = 'none';

                switchPage('page-slip');
            } else {
                document.getElementById('error-txt').innerText = "密碼不正確。";
                document.getElementById('error-txt').style.display = "block";
            }
        })
        .catch(err => {
            btn.innerText = "驗證";
            btn.disabled = false;
            alert("網路錯誤或安全驗證未通過！");
        });
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }
    function goBack(pageId) { switchPage(pageId); }
    function logout() { currentSelectedEmployee = ""; switchPage('page-main'); }
</script>

</body>
</html>
