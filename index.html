<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳麟 員工薪資查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ==================================================== */
        /* Apple 官網級 徹底去框、全螢幕大氣橫向撐開視覺規範     */
        /* ==================================================== */
        :root {
            --apple-border: rgba(0, 0, 0, 0.08);
            --apple-text: #1d1d1f;
            --apple-text-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-danger: #ff3b30;
            --input-bg: rgba(0, 0, 0, 0.04);
            --apple-ease: cubic-bezier(0.25, 1, 0.5, 1);
            
            /* 🪐 功能 1：淺色模式動態漸層底色 */
            --bg-gradient-1: #f5f5f7;
            --bg-gradient-2: #e8e8ed;
            --bg-gradient-3: #f0f0f5;
            --segment-bg: rgba(0, 0, 0, 0.05);
            --segment-active: #ffffff;
            --slip-row-border: rgba(0, 0, 0, 0.1);
        }

        /* 🌙 Apple 深色模式 (Midnight Black) */
        [data-theme="dark"] {
            --apple-border: rgba(255, 255, 255, 0.1);
            --apple-text: #f5f5f7;
            --apple-text-gray: #86868b;
            --apple-blue: #2997ff;
            --apple-blue-hover: #43a4ff;
            --apple-danger: #ff453a;
            --input-bg: rgba(255, 255, 255, 0.08);
            
            /* 🪐 功能 1：深色模式動態漸層底色 */
            --bg-gradient-1: #000000;
            --bg-gradient-2: #161617;
            --bg-gradient-3: #0a0a0b;
            --segment-bg: rgba(255, 255, 255, 0.1);
            --segment-active: #2c2c2e;
            --slip-row-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            
            /* 🪐 功能 1：實裝流動漸層背景 */
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            transition: color 0.5s var(--apple-ease);
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 頂部導覽列：左右對齊延伸 */
        .apple-nav {
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--apple-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            box-sizing: border-box;
            position: fixed;
            top: 0; left: 0;
            z-index: 100;
        }
        [data-theme="dark"] .apple-nav { background: rgba(22, 22, 23, 0.7); }
        .nav-brand { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; opacity: 0.9; }
        
        .theme-toggle-btn {
            background: transparent;
            border: none;
            color: var(--apple-text-gray);
            font-size: 12px;
            cursor: pointer;
        }

        /* 徹底去框：主容器寬度全開，不再有中間限制卡片 */
        .main-wrapper {
            flex: 1;
            width: 100%;
            max-width: 1200px; /* 超大寬幅撐開 */
            margin: 0 auto;
            padding: 100px 32px 60px 32px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 內容區直接100%填滿，消滅寬度上限 */
        .full-content-flow {
            width: 100%;
            text-align: center;
            animation: appleFadeIn 0.6s var(--apple-ease) forwards;
        }

        @keyframes appleFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: var(--apple-text); 
            margin-top: 0;
            margin-bottom: 12px; 
            font-size: 36px;
            font-weight: 700; 
            letter-spacing: -0.04em;
        }
        
        .page { display: none; opacity: 0; width: 100%; }
        .page.active { display: block; animation: pageIn 0.5s var(--apple-ease) forwards; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-group { margin-bottom: 40px; width: 100%; text-align: center; }
        label { display: block; margin-bottom: 16px; color: var(--apple-text-gray); font-size: 15px; font-weight: 500; }

        /* 📅 功能 3：Apple 膠囊型橫向分頁鈕（可隨畫面延伸） */
        .segmented-control {
            display: flex;
            background: var(--segment-bg);
            border-radius: 14px;
            padding: 4px;
            margin: 0 auto;
            width: 100%;
            max-width: 600px; /* 大氣延伸寬度 */
            box-sizing: border-box;
        }
        .segment-item {
            flex: 1;
            text-align: center;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            color: var(--apple-text);
            cursor: pointer;
            user-select: none;
            border-radius: 10px;
            transition: all 0.25s var(--apple-ease);
        }
        .segment-item.active {
            background: var(--segment-active);
            box-shadow: 0px 4px 12px rgba(0,0,0,0.06);
            font-weight: 600;
        }

        /* 🔒 功能 5：iOS 原生解鎖小圓圈 */
        .dot-container {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin: 32px 0;
        }
        .pass-dot {
            width: 16px;
            height: 16px;
            border: 2px solid var(--apple-text);
            border-radius: 50%;
            transition: background-color 0.15s ease;
        }
        .pass-dot.filled {
            background-color: var(--apple-text);
        }
        .hidden-input { position: absolute; top: -9999px; opacity: 0; }
        
        .remember-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--apple-text-gray);
            cursor: pointer;
        }
        .remember-container input { width: 16px; height: 16px; accent-color: var(--apple-blue); }

        /* 員工列表：改為全螢幕大網格，徹底撐開 */
        .employee-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* 自動填滿寬度，畫面越大排越多 */
            gap: 16px; 
            width: 100%;
            max-width: 800px;
            margin: 24px auto 0 auto;
        }

        .emp-btn { 
            background-color: transparent; 
            border: 1.5px solid var(--apple-text); /* 去掉白色底色，變成純文字線條感 */
            border-radius: 16px; 
            padding: 20px 12px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 600; 
            color: var(--apple-text); 
            transition: all 0.25s var(--apple-ease);
        }
        .emp-btn:hover { background-color: var(--apple-text); color: var(--bg-gradient-1); }
        .emp-btn:active { transform: scale(0.95); } 
        
        .btn-primary { 
            width: 100%; 
            max-width: 340px;
            padding: 16px; 
            background-color: var(--apple-blue); 
            border: none; 
            color: white; 
            border-radius: 28px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 500; 
            margin: 0 auto;
            display: block;
            transition: all 0.2s var(--apple-ease); 
        }
        .btn-primary:hover { background-color: var(--apple-blue-hover); }
        .btn-primary:disabled { opacity: 0.5; }
        
        .btn-link {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--apple-blue);
            font-size: 14px;
            cursor: pointer;
            margin-top: 28px;
        }

        /* 徹底去框的薪資明細表：直接在背景上平鋪，無外框卡片與背景色 */
        .salary-slip { 
            margin: 30px auto 0 auto; 
            width: 100%;
            max-width: 600px; /* 大氣寬度 */
            padding: 0;
        }
        .slip-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 22px 0; 
            border-bottom: 1px solid var(--slip-row-border); 
            font-size: 17px; 
            color: var(--apple-text); 
            align-items: center; 
        }
        .slip-label { color: var(--apple-text-gray); font-weight: 400; }
        .slip-value { font-weight: 600; }
        
        .slip-total { 
            display: flex; 
            justify-content: space-between; 
            padding: 30px 0 20px 0; 
            font-weight: 700; 
            font-size: 28px; 
            color: var(--apple-text); 
            border-top: 2px solid var(--apple-text); 
            margin-top: 16px; 
            align-items: center; 
        }
        .deduct-style { color: var(--apple-danger); }
        
        .error-msg { color: var(--apple-danger); font-size: 14px; margin-top: 16px; font-weight: 500; }
        .welcome-msg { text-align: center; font-size: 15px; color: var(--apple-text-gray); margin-bottom: 40px; }

        /* 📄 功能 6：長按儲存防呆提示氣泡 */
        .preview-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .防呆氣泡 {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s var(--apple-ease);
        }
        .防呆氣泡.active { opacity: 1; animation: pulseFinger 1.8s infinite ease-in-out; }
        @keyframes pulseFinger {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.04); }
        }

        /* LINE 彈窗 */
        .line-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .line-modal-content {
            background: var(--bg-gradient-1);
            border: 1px solid var(--apple-border);
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        #img-preview-area {
            margin-top: 40px;
            display: none;
            text-align: center;
            border-top: 1px solid var(--apple-border);
            padding-top: 32px;
        }
        #img-preview-area img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        .loading-dots::after { content: ''; animation: dots 1.5s infinite steps(4); display: inline-block; width: 12px; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    </style>
</head>
<body>

<div class="apple-nav">
    <div class="nav-brand">鳳麟 竹南店</div>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">深色模式</button>
</div>

<div class="main-wrapper" id="main-card">
    <div class="full-content-flow">

        <div id="page-loading" class="page active">
            <h2>薪資查詢系統</h2>
            <div style="font-size: 15px; color: var(--apple-text-gray); margin-top: 20px;">
                <span class="loading-dots">安全連線中</span>
            </div>
        </div>

        <div id="page-main" class="page">
            <h2>薪資查詢系統</h2>
            <div class="welcome-msg" id="greeting-txt"></div>
            
            <div class="input-group">
                <label>選擇查詢月份</label>
                <div class="segmented-control" id="month-segmented"></div>
            </div>
            
            <label style="margin-bottom: 6px;">選擇您的姓名</label>
            <div class="employee-grid" id="employee-box"></div>
        </div>

        <div id="page-auth" class="page">
            <h2 id="auth-title">身分驗證</h2>
            <div style="text-align: center; margin-top: 10px;">
                <label>請輸入身分證後 4 碼</label>
                
                <div class="dot-container" onclick="focusSecretInput()">
                    <div class="pass-dot" id="dot-0"></div>
                    <div class="pass-dot" id="dot-1"></div>
                    <div class="pass-dot" id="dot-2"></div>
                    <div class="pass-dot" id="dot-3"></div>
                </div>

                <input type="tel" id="hidden-password" class="hidden-input" maxlength="4" oninput="handleDotInput(this)">

                <label class="remember-container">
                    <input type="checkbox" id="remember-pwd"> 記住密碼
                </label>
                <div class="error-msg" id="error-txt">密碼不正確。</div>
            </div>
            <button class="btn-primary" style="margin-top: 24px;" id="submit-pwd-btn" onclick="verifyPassword()">驗證</button>
            <button class="btn-link" onclick="goBack('page-main')">返回主畫面</button>
        </div>

        <div id="page-slip" class="page">
            <div id="capture-area" style="padding: 24px 16px; border-radius: 16px;">
                <h2 id="slip-title" style="margin-top: 10px; text-align: left; font-size: 28px;">薪資明細表</h2>
                
                <div class="salary-slip">
                    <div class="slip-row">
                        <span class="slip-label">員工姓名</span>
                        <span id="slip-name" class="slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">時薪</span>
                        <span id="slip-wage" class="slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">本月時數</span>
                        <span id="slip-hours" class="slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">遲到 (分鐘)</span>
                        <span id="slip-latemin" class="slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">預支項目</span>
                        <span id="slip-advance" class="deduct-style slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">營運損失</span>
                        <span id="slip-loss" class="deduct-style slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">缺失次數</span>
                        <span id="slip-missing" class="slip-value"></span>
                    </div>
                    <div class="slip-row">
                        <span class="slip-label">遲到次數</span>
                        <span id="slip-latecount" class="slip-value"></span>
                    </div>
                    <div class="slip-total">
                        <span>實領薪資 <span style="font-size:13px; color:var(--apple-text-gray); font-weight:400;">(不含獎金)</span></span>
                        <span id="slip-total"></span>
                    </div>
                </div>
            </div>
            
            <button class="btn-primary" style="margin-top: 32px;" id="download-btn" onclick="downloadSlip()">儲存薪資單圖片</button>
            
            <div id="img-preview-area">
                <p style="font-size: 13px; color: var(--apple-text-gray); margin: 0 0 16px 0;">已為您產生明細照片。請長按下方圖片儲存。</p>
                <div class="preview-wrapper">
                    <div class="防呆氣泡" id="hint-bubble">☝️ 長按圖片儲存至相簿</div>
                    <img id="generated-img" src="" alt="薪資單圖片">
                </div>
            </div>

            <button class="btn-link" style="margin-top: 32px;" onclick="logout()">安全登出</button>
        </div>

    </div>
</div>

<div class="line-modal" id="line-alert">
    <div class="line-modal-content">
        <h3 style="margin-top: 0; font-size: 18px; font-weight: 600;">LINE 瀏覽器限制</h3>
        <p style="font-size: 13px; text-align: left; line-height: 1.6; color: var(--apple-text-gray); margin-bottom: 24px;">
            目前正使用 LINE 內建瀏覽器，該環境不支援直接下載檔案。<br><br>
            請直接長按下方新生成的明細圖片儲存；或點擊右上角 <code>•••</code> 選擇<strong>【使用預設瀏覽器開啟】</strong>即可正常下載。
        </p>
        <button class="btn-primary" style="padding: 12px;" onclick="closeLineModal()">好</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwnlxGByCNwcbJaLOP4kJB6UDHTZHRf3on24LAA60zKFtEQKCnfvOYHN6KdowKyTdnJ/exec"; 

    let currentSelectedEmployee = "";
    let selectedMonthValue = ""; 
    let allMonths = [];
    let allEmployees = [];

    window.onload = function() { 
        initTheme();     
        updateGreeting(); 
        initSystem(); 
    };

    function updateGreeting() {
        const hour = new Date().getHours();
        let greeting = "";
        if (hour >= 5 && hour < 11) greeting = "早安。今天也是充滿活力的一天。";
        else if (hour >= 11 && hour < 14) greeting = "午安。忙碌的午餐餐期辛苦了。";
        else if (hour >= 14 && hour < 17) greeting = "空班休息時間。充飽電再出發。";
        else if (hour >= 17 && hour < 21) greeting = "晚餐尖峰時間。辛苦了。";
        else greeting = "深夜下班辛苦了。回家路上請注意安全。";
        document.getElementById('greeting-txt').innerText = greeting;
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('userTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-btn').innerText = savedTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        let newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('userTheme', newTheme);
        document.getElementById('theme-btn').innerText = newTheme === 'dark' ? '淺色模式' : '深色模式';
    }

    function focusSecretInput() {
        document.getElementById('hidden-password').focus();
    }
    function handleDotInput(el) {
        el.value = el.value.replace(/[^0-9]/g, ''); 
        const val = el.value;
        
        for(let i=0; i<4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if(i < val.length) dot.classList.add('filled');
            else dot.classList.remove('filled');
        }
        
        if(val.length === 4) verifyPassword();
    }

    function isLineBrowser() {
        return navigator.userAgent.toLowerCase().indexOf('line') !== -1;
    }

    function closeLineModal() {
        document.getElementById('line-alert').style.display = 'none';
    }

    function downloadSlip() {
        const target = document.getElementById('capture-area');
        const originalBg = target.style.background;
        const currentTheme = document.documentElement.getAttribute('data-theme');
        
        // 截圖時給予純色底色確保清晰
        target.style.background = currentTheme === 'dark' ? '#161617' : '#f5f5f7';

        html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
            target.style.background = originalBg; 
            const imgDataURL = canvas.toDataURL('image/png');

            const previewArea = document.getElementById('img-preview-area');
            const previewImg = document.getElementById('generated-img');
            previewImg.src = imgDataURL;
            previewArea.style.display = 'block';

            const bubble = document.getElementById('hint-bubble');
            bubble.classList.add('active');
            setTimeout(() => { bubble.classList.remove('active'); }, 4000);

            if (isLineBrowser()) {
                document.getElementById('line-alert').style.display = 'flex';
                previewArea.scrollIntoView({ behavior: 'smooth' });
            } else {
                const link = document.createElement('a');
                link.download = `${selectedMonthValue}_鳳麟_${currentSelectedEmployee}_薪資明細.png`;
                link.href = imgDataURL;
                link.click();
            }
        });
    }

    function initSystem() {
        switchPage('page-loading');
        fetch(`${API_URL}?action=getInitData`)
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                allMonths = data.months;
                allEmployees = data.names;
                
                const segmentedControl = document.getElementById('month-segmented');
                segmentedControl.innerHTML = "";
                const currentMonthStr = (new Date().getMonth() + 1) + "月"; 
                selectedMonthValue = allMonths.includes(currentMonthStr) ? currentMonthStr : allMonths[allMonths.length - 1];

                allMonths.forEach(m => {
                    const item = document.createElement('div');
                    item.className = `segment-item ${m === selectedMonthValue ? 'active' : ''}`;
                    item.innerText = m;
                    item.onclick = function() {
                        document.querySelectorAll('.segment-item').forEach(i => i.classList.remove('active'));
                        item.classList.add('active');
                        selectedMonthValue = m;
                    };
                    segmentedControl.appendChild(item);
                });

                const employeeBox = document.getElementById('employee-box');
                employeeBox.innerHTML = "";
                allEmployees.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'emp-btn';
                    btn.innerText = name;
                    btn.onclick = () => selectEmployee(name);
                    employeeBox.appendChild(btn);
                });
                
                switchPage('page-main');
            } else {
                alert("載入失敗：" + data.message);
            }
        })
        .catch(err => {
            alert("系統安全連線中，請稍候...");
            window.location.href = API_URL + "?action=getInitData";
        });
    }

    function selectEmployee(name) {
        currentSelectedEmployee = name;
        document.getElementById('auth-title').innerText = name;
        
        const hiddenInput = document.getElementById('hidden-password');
        const rememberCheckbox = document.getElementById('remember-pwd');
        document.getElementById('error-txt').style.display = "none";
        
        hiddenInput.value = "";
        for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).classList.remove('filled');
        
        const savedPassword = localStorage.getItem('savedPwd_' + name);
        if (savedPassword) {
            hiddenInput.value = savedPassword; 
            rememberCheckbox.checked = true; 
            for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).classList.add('filled');
        } else {
            rememberCheckbox.checked = false;
        }
        
        switchPage('page-auth');
        setTimeout(focusSecretInput, 400);
    }

    function shakeCard() {
        const wrapper = document.getElementById('main-card');
        wrapper.style.transition = 'none';
        let startTime = Date.now();
        let duration = 400; 
        function animate() {
            let elapsed = Date.now() - startTime;
            if (elapsed < duration) {
                let x = Math.sin((elapsed / duration) * Math.PI * 5) * 8 * (1 - elapsed / duration);
                wrapper.style.transform = `translateX(${x}px)`;
                requestAnimationFrame(animate);
            } else {
                wrapper.style.transform = '';
                wrapper.style.transition = '';
            }
        }
        animate();
    }

    function formatNumber(val) {
        if (isNaN(val) || val === "") return val;
        return Number(val).toLocaleString();
    }

    function verifyPassword() {
        const hiddenInput = document.getElementById('hidden-password');
        const inputPwd = hiddenInput.value;
        if(!inputPwd || inputPwd.length < 4) return;

        const btn = document.getElementById('submit-pwd-btn');
        const rememberCheckbox = document.getElementById('remember-pwd');
        
        btn.innerText = "驗證中...";
        btn.disabled = true;

        fetch(`${API_URL}?action=getSalary&month=${encodeURIComponent(selectedMonthValue)}&name=${encodeURIComponent(currentSelectedEmployee)}&password=${encodeURIComponent(inputPwd)}`)
        .then(response => response.json())
        .then(data => {
            btn.innerText = "驗證";
            btn.disabled = false;

            if (data.status === "success") {
                if (rememberCheckbox.checked) {
                    localStorage.setItem('savedPwd_' + currentSelectedEmployee, inputPwd);
                } else {
                    localStorage.removeItem('savedPwd_' + currentSelectedEmployee);
                }

                const empData = data.data;
                document.getElementById('slip-title').innerText = `${selectedMonthValue} 薪資明細`;
                document.getElementById('slip-name').innerText = currentSelectedEmployee;
                
                document.getElementById('slip-wage').innerText = formatNumber(empData.hourlyWage) + " 元";
                document.getElementById('slip-hours').innerText = empData.hours + " 小時";
                document.getElementById('slip-latemin').innerText = empData.lateMin + " 分鐘";
                document.getElementById('slip-advance').innerText = "- " + formatNumber(empData.advance) + " 元";
                document.getElementById('slip-loss').innerText = "- " + formatNumber(empData.loss) + " 元";
                document.getElementById('slip-missing').innerText = empData.missing + " 次";
                document.getElementById('slip-latecount').innerText = empData.lateCount + " 次";
                document.getElementById('slip-total').innerText = `$ ${formatNumber(empData.totalSalary)}`;
                
                document.getElementById('img-preview-area').style.display = 'none';

                switchPage('page-slip');
            } else {
                document.getElementById('error-txt').innerText = "密碼不正確。";
                document.getElementById('error-txt').style.display = "block";
                
                hiddenInput.value = "";
                for(let i=0; i<4; i++) document.getElementById(`dot-${i}`).classList.remove('filled');
                
                shakeCard(); 
                focusSecretInput();
            }
        })
        .catch(err => {
            btn.innerText = "驗證";
            btn.disabled = false;
            alert("網路錯誤或安全驗證未通過！");
        });
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }
    function goBack(pageId) { switchPage(pageId); }
    function logout() { currentSelectedEmployee = ""; switchPage('page-main'); }
</script>

</body>
</html>
