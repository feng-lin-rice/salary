<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳳麟 員工薪資查詢系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --apple-text: #1d1d1f;
            --apple-text-gray: #86868b;
            --apple-blue: #0071e3;
            --apple-danger: #ff3b30;
            --bg-gradient-1: #f5f5f7;
            --bg-gradient-2: #e8e8ed;
            --bg-gradient-3: #f0f0f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
            color: var(--apple-text);
            min-height: 100vh;
        }

        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 { font-size: 32px; font-weight: 700; margin-bottom: 24px; }
        
        /* 下拉式選單樣式 */
        select {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.8);
            margin-bottom: 24px;
            appearance: none;
        }

        .page { display: none; }
        .page.active { display: block; }

        .employee-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-top: 20px;
        }

        .emp-btn { 
            padding: 16px; 
            border: 1px solid var(--apple-text); 
            border-radius: 12px; 
            background: transparent; 
            font-weight: 600; 
            cursor: pointer;
        }
        
        .emp-btn:hover { background: var(--apple-text); color: white; }

        .salary-slip { margin-top: 40px; text-align: left; }
        .slip-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
        
        .btn-primary { 
            width: 100%; padding: 16px; background: var(--apple-blue); 
            color: white; border: none; border-radius: 28px; font-size: 16px; margin-top: 24px; cursor: pointer;
        }

        .dot-container { display: flex; justify-content: center; gap: 20px; margin: 24px 0; }
        .pass-dot { width: 16px; height: 16px; border: 2px solid var(--apple-text); border-radius: 50%; }
        .pass-dot.filled { background-color: var(--apple-text); }
        .hidden-input { position: absolute; opacity: 0; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="page-main" class="page active">
        <h2>薪資查詢</h2>
        <!-- 恢復下拉式選單 -->
        <select id="month-select"></select>
        <div class="employee-grid" id="employee-box"></div>
    </div>

    <div id="page-auth" class="page">
        <h2 id="auth-name">請輸入密碼</h2>
        <div class="dot-container" onclick="document.getElementById('hidden-password').focus()">
            <div class="pass-dot" id="dot-0"></div><div class="pass-dot" id="dot-1"></div>
            <div class="pass-dot" id="dot-2"></div><div class="pass-dot" id="dot-3"></div>
        </div>
        <input type="tel" id="hidden-password" class="hidden-input" maxlength="4" oninput="handleDot(this)">
    </div>

    <div id="page-slip" class="page">
        <h2>薪資明細</h2>
        <div class="salary-slip" id="capture-area">
            <div class="slip-row"><span>實領薪資</span><span id="slip-total"></span></div>
        </div>
        <button class="btn-primary" onclick="window.location.reload()">返回首頁</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwnlxGByCNwcbJaLOP4kJB6UDHTZHRf3on24LAA60zKFtEQKCnfvOYHN6KdowKyTdnJ/exec";
    
    // 初始化系統
    fetch(`${API_URL}?action=getInitData`)
    .then(r => r.json())
    .then(data => {
        const select = document.getElementById('month-select');
        const currentMonth = (new Date().getMonth() + 1) + "月";
        
        data.months.forEach(m => {
            let opt = document.createElement('option');
            opt.value = m;
            opt.text = m;
            // 自動選取當月
            if (m === currentMonth) opt.selected = true;
            select.appendChild(opt);
        });

        data.names.forEach(n => {
            let btn = document.createElement('button');
            btn.className = 'emp-btn';
            btn.innerText = n;
            btn.onclick = () => { window.selectedEmp = n; document.getElementById('page-main').classList.remove('active'); document.getElementById('page-auth').classList.add('active'); };
            document.getElementById('employee-box').appendChild(btn);
        });
    });

    function handleDot(el) {
        const val = el.value;
        document.querySelectorAll('.pass-dot').forEach((d, i) => d.classList.toggle('filled', i < val.length));
        if(val.length === 4) {
            // 簡化驗證邏輯，這裡直接進明細頁模擬
            document.getElementById('page-auth').classList.remove('active');
            document.getElementById('page-slip').classList.add('active');
        }
    }
</script>
</body>
</html>
