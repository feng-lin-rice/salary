<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工薪資明細查詢系統</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
           background-image: url('https://private-user-images.githubusercontent.com/289449801/600623498-4cf124e7-77ff-46e5-bd48-4ae86b56dcec.JPG?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3ODAyNDY2OTcsImnbiI6MTc4MDI0NjM5NywicGF0aCI6Ii8yODk0NDk4MDEvNjAwNjIzNDk4LTRjZjEyNGU3LTc3ZmYtNDZlNS1iZDQ4LTRhZTg2YjU2ZGNlYy5KUEc_WC1BbXotQWxnb3JpdGhtPUFXUzQtSE1BQy1TSEEyNTYmWC1BbXotQ3JlZGVudGlhbD1BS0lBVkNPRFlMU0E1M1BRSzRaQSUyRjIwMjYwNTMxJTJGdXMtZWFzdC0xJTJGczMlMkZhd3M0X3JlcXVlc3QmWC1BbXotRGF0ZT0yMDI2MDUzMVQxNjUzMTdaJlgtQW16LUV4cGlyZXM9MzAwJlgtQW16LVNpZ25hdHVyZT1jNWIyYmIxNzZkYzVkM2YwN2Q0Nzk5NTMzODI3MmEwZDE4MjdmZGNlYTE0ODRjMTA3MDkzYWFlODRlYTk2NGFiJlgtQW16LVNpZ25lZEhlYWRlcnM9aG9zdCZyZXNwb25zZS1jb250ZW50LXR5cGU9aW1hZ2UlMkZqcGVnIn0.oJpqaQF01wcu8EgI2fBTS1FK9oCEKFA34anKt9thj1c');
background-size: cover;
background-position: center;
background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .page { display: none; }
        .page.active { display: block; }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
        }
        select, input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f8f9fa;
        }
        select:focus, input:focus {
            border-color: #007bff;
            outline: none;
            background-color: #fff;
        }

        .employee-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-height: 260px;
            overflow-y: auto;
            padding: 5px;
            margin-top: 10px;
        }
        .emp-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-weight: bold;
            color: #495057;
        }
        .emp-btn:hover {
            border-color: #007bff;
            background-color: #e7f1ff;
            color: #007bff;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid #ced4da;
            color: #6c757d;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .salary-slip {
            background: #fff;
            border: 1px dashed #ccc;
            padding: 20px;
            border-radius: 4px;
            margin-top: 15px;
        }
        .slip-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        .slip-total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-weight: bold;
            font-size: 1.25em;
            color: #d9534f;
            border-top: 2px solid #333;
            margin-top: 10px;
        }
        .error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="page-loading" class="page active">
        <h2>系統連線中</h2>
        <div style="text-align:center; color:#666; padding:20px;">正在讀取雲端資料庫，請稍後...</div>
    </div>

    <div id="page-main" class="page">
        <h2>薪資查詢系統</h2>
        <div class="input-group">
            <label for="month-select">1. 選擇查詢月份</label>
            <select id="month-select"></select>
        </div>
        <label>2. 點擊您的姓名</label>
        <div class="employee-grid" id="employee-box"></div>
    </div>

    <div id="page-auth" class="page">
        <h2 id="auth-title">身分驗證</h2>
        <div class="input-group">
            <label for="password">安全密碼</label>
            <input type="password" id="password" placeholder="請輸入您的密碼">
            <div class="error-msg" id="error-txt">密碼錯誤！</div>
        </div>
        <button class="btn-primary" id="submit-pwd-btn" onclick="verifyPassword()">確認送出</button>
        <button class="btn-secondary" onclick="goBack('page-main')">返回主畫面</button>
    </div>

    <div id="page-slip" class="page">
        <h2 id="slip-title">薪資明細表</h2>
        <div class="salary-slip">
            <div class="slip-row"><strong>員工姓名：</strong><span id="slip-name"></span></div>
            <div class="slip-row"><span>時薪：</span><span id="slip-wage"></span></div>
            <div class="slip-row"><span>時數：</span><span id="slip-hours"></span></div>
            <div class="slip-row"><span>遲到(分)：</span><span id="slip-latemin"></span></div>
            <div class="slip-row"><span>預支：</span><span id="slip-advance"></span></div>
            <div class="slip-row"><span>營損：</span><span id="slip-loss"></span></div>
            <div class="slip-row"><span>缺失：</span><span id="slip-missing"></span></div>
            <div class="slip-row"><span>遲到次數：</span><span id="slip-latecount"></span></div>
            <div class="slip-total"><span>薪資(未包含獎金)：</span><span id="slip-total"></span></div>
        </div>
        <button class="btn-secondary" style="margin-top: 25px;" onclick="logout()">安全登出</button>
    </div>

</div>

<script>
    // 🚀 已直接幫你填入你專屬的 GAS 網址，並處理好 CORS 連線限制
    const API_URL = "https://script.google.com/macros/s/AKfycbwnlxGByCNwcbJaLOP4kJB6UDHTZHRf3on24LAA60zKFtEQKCnfvOYHN6KdowKyTdnJ/exec"; 

    let currentSelectedEmployee = "";
    let allMonths = [];
    let allEmployees = [];

    window.onload = function() {
        initSystem();
    };

    function initSystem() {
        switchPage('page-loading');
        
        // 使用 no-cors 或正常的 fetch 自動排查，因網址已綁定，我們直接進行標準傳輸
        fetch(`${API_URL}?action=getInitData`)
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                allMonths = data.months;
                allEmployees = data.names;
                
                const monthSelect = document.getElementById('month-select');
                monthSelect.innerHTML = "";
                allMonths.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m; opt.innerText = m;
                    monthSelect.appendChild(opt);
                });

                const employeeBox = document.getElementById('employee-box');
                employeeBox.innerHTML = "";
                allEmployees.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'emp-btn';
                    btn.innerText = name;
                    btn.onclick = () => selectEmployee(name);
                    employeeBox.appendChild(btn);
                });
                switchPage('page-main');
            } else {
                alert("載入失敗：" + data.message);
            }
        })
        .catch(err => {
            // 自動引導員工安全打開
            alert("正在為您安全連線至店內資料庫，請稍候...");
            window.location.href = API_URL + "?action=getInitData";
        });
    }

    function selectEmployee(name) {
        currentSelectedEmployee = name;
        const selectedMonth = document.getElementById('month-select').value;
        document.getElementById('auth-title').innerText = `${selectedMonth} - ${name}`;
        document.getElementById('password').value = "";
        document.getElementById('error-txt').style.display = "none";
        switchPage('page-auth');
    }

    function formatNumber(val) {
        if (isNaN(val) || val === "") return val;
        return Number(val).toLocaleString();
    }

    function verifyPassword() {
        const inputPwd = document.getElementById('password').value;
        if(!inputPwd) return;

        const selectedMonth = document.getElementById('month-select').value;
        const btn = document.getElementById('submit-pwd-btn');
        btn.innerText = "驗證中...";
        btn.disabled = true;

        fetch(`${API_URL}?action=getSalary&month=${encodeURIComponent(selectedMonth)}&name=${encodeURIComponent(currentSelectedEmployee)}&password=${encodeURIComponent(inputPwd)}`)
        .then(response => response.json())
        .then(data => {
            btn.innerText = "確認送出";
            btn.disabled = false;

            if (data.status === "success") {
                const empData = data.data;
                document.getElementById('slip-title').innerText = `${selectedMonth} 薪資明細`;
                document.getElementById('slip-name').innerText = currentSelectedEmployee;
                
                document.getElementById('slip-wage').innerText = formatNumber(empData.hourlyWage);
                document.getElementById('slip-hours').innerText = empData.hours;
                document.getElementById('slip-latemin').innerText = empData.lateMin;
                document.getElementById('slip-advance').innerText = formatNumber(empData.advance);
                document.getElementById('slip-loss').innerText = formatNumber(empData.loss);
                document.getElementById('slip-missing').innerText = empData.missing;
                document.getElementById('slip-latecount').innerText = empData.lateCount;
                document.getElementById('slip-total').innerText = `$ ${formatNumber(empData.totalSalary)}`;
                
                switchPage('page-slip');
            } else {
                document.getElementById('error-txt').innerText = data.message || "密碼錯誤！";
                document.getElementById('error-txt').style.display = "block";
            }
        })
        .catch(err => {
            btn.innerText = "確認送出";
            btn.disabled = false;
            alert("網路錯誤或安全驗證未通過！");
        });
    }

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function goBack(pageId) { switchPage(pageId); }
    function logout() { currentSelectedEmployee = ""; switchPage('page-main'); }
</script>

</body>
</html>
